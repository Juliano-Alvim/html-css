<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de iframe</title>
    <style>
        iframe {
            height: 400px;
            width: 400px;
            border: 3px solid black;
        }
    </style>
</head>
<body>
    <h1>Testando o uso de um iframe</h1>
    <p>Eu acho que o site do <iframe src="https://www.google.com.br" frameborder="0"> <a href="https://www.google.com.br"> Google </a></iframe> não da pra usar.</p>
    <p>Mas o site do GOAT <iframe src="https://www.cursoemvideo.com/" frameborder="0" scrolling="auto"></iframe> eu consigo.</p>
</body>
</html>
