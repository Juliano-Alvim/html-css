<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulário</title>
  </head>

  <body>
    <h1>Teste de formulário</h1>
    <form method="post" action="cadastro.php" autocomplete="on">
      <p>
        <label for="inome">Nome:</label>
        <input
          type="text"
          name="nome"
          id="inome"
          required
          minlength="5"
          maxlength="10"
          size="10"
          placeholder="nome de usuário"
          autocomplete="username"
        />
      </p>
      <p>
        <label for="isobrenome">Sobrenome:</label>
        <input
          type="text"
          name="sobrenome"
          id="isobrenome"
          required
          minlength="1"
          maxlength="12"
          size="15"
          placeholder="sobrenome de usuário"
        />
      </p>
      <p>
        <label for="isenha">Senha:</label>
        <input
          type="password"
          name="senha"
          id="isenha"
          required
          minlength="5"
          maxlength="12"
          size="10"
          placeholder="mínimo 5 dígitos"
          autocomplete="current-password"
        />
      </p>
      <p>
        <input type="submit" value="Enviar" />
        <input type="reset" value="Limpar" />
      </p>
    </form>
  </body>
</html>
