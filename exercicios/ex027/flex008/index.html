<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexbox</title>
    <style>
      .conteiner {
        background-color: lightsalmon;
        display: flex;
        flex-flow: row wrap;
        align-items: flex-end;
        height: 500px;
      }

      .filho {
        border: 1px solid black;
        background-color: lightblue;
        text-align: center;
        padding: 20px;
      }

      #i1 {
        order: 3;
        align-self: auto;
      }

      #i2 {
        order: -2;
        align-self: center;
      }

      #i3 {
        order: 8;
        align-self: flex-end;
      }

      #i4 {
        order: 4;
        align-self: center;
      }

      #i5 {
        order: -4;
        align-self: stretch;
      }

      #i6 {
        order: 0;
        align-self: flex-start;
      }

      #i7 {
        order: -4;
        align-self: stretch;
      }
    </style>
  </head>
  <body>
    <div class="conteiner">
      <div class="filho" id="i1">A</div>
      <div class="filho" id="i2">B</div>
      <div class="filho" id="i3">C</div>
      <div class="filho" id="i4">D</div>
      <div class="filho" id="i5">E</div>
      <div class="filho" id="i6">F</div>
      <div class="filho" id="i7">G</div>
    </div>
  </body>
</html>
