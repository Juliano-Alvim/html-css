<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexobx</title>
    <style>

        .conteiner {
            background-color: lightsalmon;
            display: flex;
            flex-flow: row nowrap;
            height: 150px;
            max-width: 800px;
        }

        .filho {
            border: 1px solid black;
            background-color: lightblue;
            text-align: center;
            flex-basis: 150px;
            flex-shrink: 1;
            flex-grow: 1;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="filho">A</div>
        <div class="filho">Lorem, ipsum.</div>
        <div class="filho">C</div>
        <div class="filho">D</div>
        <div class="filho">E</div>
    </div>
</body>
</html>
