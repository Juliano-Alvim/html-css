<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexobx</title>
    <style>

        .conteiner {
            background-color: lightsalmon;
            display: flex;
            flex-flow: row nowrap;
        }

        .filho {
            border: 1px solid black;
            background-color: lightblue;
            text-align: center;
            flex-basis: 150px;
            
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="filho">A</div>
        <div class="filho">Lorem, ipsum.</div>
        <div class="filho">C</div>
        <div class="filho">D</div>
        <div class="filho">Lorem ipsum dolor sit amet.</div>
        <div class="filho">F</div>
        <div class="filho">Lorem ipsum dolor, sit amet consectetur adipisicing elit. Dolorem, iure?</div>
    </div>
</body>
</html>
