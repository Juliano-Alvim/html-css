<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        table {
            border-collapse: collapse;
            width: 500px;
        }

        td, tr, th {
            border: 1px, solid, black;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td>A</td>
            <td colspan="2">B</td>
        </tr>
        <tr>
            <td rowspan="3">D</td>
            <td>E</td>
            <td>F</td>
        </tr>
        <tr>
            <td>H</td>
            <td>I</td>
        </tr>
        <tr>

            <td>L</td>
            <td>M</td>
        </tr>
    </table>

    <h1>teste</h1>

    <table>
        <thead>
            <tr>
                <th>Nome</th>
                <th colspan="3">Telefone</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Juliano</td>
                <td>(32)99990-8837</td>
                <td>(32)3274-3981</td>
                <td>(32)99183-2984</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
